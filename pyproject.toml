[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reconstruction-pilot"
version = "0.1.0"
description = "A bounded screen of source attribution during reasoning evaluation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
reconstruction-pilot = "reconstruction_pilot.cli:main"

[tool.setuptools.packages.find]
include = ["reconstruction_pilot*"]

[tool.setuptools.package-data]
reconstruction_pilot = ["data/*.json", "data/*.jsonl"]
